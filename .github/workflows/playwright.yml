name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Adds a manual "Run workflow" button in the Actions tab.
  workflow_dispatch:

# Every run uses the same shared BrightHR account, so runs queue
# instead of overlapping and interfering with each other.
concurrency:
  group: brighthr-sandbox
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Unit tests need no browser, so they run first and fail the build fast.
      - name: Run unit tests
        run: npm run test:unit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (positive + negative)
        run: npm run test:e2e
        env:
          BRIGHTHR_EMAIL: ${{ secrets.BRIGHTHR_EMAIL }}
          BRIGHTHR_PASSWORD: ${{ secrets.BRIGHTHR_PASSWORD }}

      # The reports below are built and uploaded even when tests fail,
      # because that is when they are most useful.
      - name: Build test report dashboard
        if: always()
        run: npm run dashboard

      - name: Upload test report dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-dashboard
          path: dashboard/
          retention-days: 14

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces, screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
