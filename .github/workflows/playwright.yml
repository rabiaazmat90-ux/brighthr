# CI pipeline - GitHub Actions
#
# WHY GitHub Actions: the code already lives on GitHub, it is free for public
# repos, needs no server to maintain, and BrightHR can see every run and its
# report from the repo link we submit.
# ALTERNATIVES: Azure DevOps, Jenkins, GitLab CI or CircleCI would run the same
# three commands (install, install browsers, test); only the YAML syntax differs.

name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual "Run workflow" button - handy for re-running during the interview.
  workflow_dispatch:
  # Nightly run (02:00 UTC) catches breakages caused by changes on BrightHR's
  # side even when nobody pushes code. Remove if not wanted.
  schedule:
    - cron: '0 2 * * *'

# WHY concurrency: every run uses the same shared BrightHR account. Two runs at
# once could interfere, so a new run waits for the previous one to finish.
concurrency:
  group: brighthr-sandbox
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Caches the npm download cache between runs for faster installs.
          cache: npm

      # WHY npm ci (not npm install): installs EXACTLY what package-lock.json
      # says, so CI uses the same versions that passed locally.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # WHY unit tests BEFORE installing browsers: they need no browser, take
      # about a second, and fail the build immediately if a helper or the
      # test data is broken - no point spending minutes on E2E tests then.
      - name: Run unit tests
        run: npm run test:unit

      # --with-deps also installs the Linux libraries Chromium needs.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (positive + negative)
        run: npm run test:e2e
        env:
          # Credentials come from encrypted repo secrets - never stored in code.
          BRIGHTHR_EMAIL: ${{ secrets.BRIGHTHR_EMAIL }}
          BRIGHTHR_PASSWORD: ${{ secrets.BRIGHTHR_PASSWORD }}

      # Builds the scenario dashboard from the unit + E2E results.
      # if: always() so it is produced even when tests fail - that is when
      # a reviewer most needs the overview.
      - name: Build test report dashboard
        if: always()
        run: npm run dashboard

      - name: Upload test report dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-dashboard
          path: dashboard/
          retention-days: 14

      # WHY if: always() - the report is MOST useful when tests fail, so it is
      # uploaded whether the job passes or not.
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces, screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
